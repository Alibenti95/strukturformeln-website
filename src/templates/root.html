<!DOCTYPE html>
<html lang="{{default_language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{app_name}}</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="{{site_url}}{{base}}/">
  <link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base}}/css/style.css">
  <script>
    // Sprachweiche: die Sprache des Browsers entscheidet, Deutsch ist die Vorgabe. Ohne JavaScript
    // bleibt die Liste darunter. Es wird nichts gespeichert und nichts übertragen.
    (function () {
      var codes = {{language_codes}};
      var wanted = (navigator.languages || [navigator.language || ""]).map(function (l) { return l.toLowerCase(); });
      var target = "{{default_language}}";
      // erst die genaue Variante (es-mx), dann dieselbe Sprache (es → erste aktive es-…)
      outer: for (var i = 0; i < wanted.length; i++) {
        if (codes.indexOf(wanted[i]) >= 0) { target = wanted[i]; break; }
        var primary = wanted[i].split("-")[0];
        for (var j = 0; j < codes.length; j++) {
          if (codes[j] === primary || codes[j].split("-")[0] === primary) { target = codes[j]; break outer; }
        }
      }
      location.replace("{{base}}/" + target + "/");
    })();
  </script>
</head>
<body class="weiche">
  <main class="rahmen weiche-innen">
    <h1>{{app_name}}</h1>
    <ul class="weiche-liste">
      {{language_links}}
    </ul>
    <p class="weiche-links weiche-recht">{{legal_links}}</p>
  </main>
</body>
</html>
